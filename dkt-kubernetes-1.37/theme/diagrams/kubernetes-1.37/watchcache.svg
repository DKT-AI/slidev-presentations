<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 120 1280 450" role="img" aria-labelledby="watchcache-title watchcache-desc" id="watchcache-root"><title id="watchcache-title">Прогрев watchcache без перегрузки</title><desc id="watchcache-desc">Во время прогрева watchcache API server отклоняет watch и часть list с HTTP 429, а допустимые запросы направляет в etcd.</desc><defs>
      <style>1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #watchcache-root { color: #FFFFFF; font-family: Montserrat,Arial,sans-serif; }
      #watchcache-root .diagram { overflow-x:auto }</style><marker id="watchcache-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><marker id="watchcache-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38E0FF"/></marker></defs><rect width="1280" height="720" fill="#111827"/><path d="M 368 216 H 488" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#watchcache-arrow)"/><path d="M 640 288 V 400" fill="none" stroke="#38E0FF" stroke-width="3"  marker-end="url(#watchcache-arrow-accent)"/><path d="M 488 472 H 392 Q 384 472 384 464 V 256 Q 384 248 376 248 H 368" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#watchcache-arrow)"/><path d="M 792 192 H 872 Q 880 192 880 200 V 464 Q 880 472 888 472 H 928" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#watchcache-arrow)"/><g><rect x="64" y="144" width="304" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="216" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="216" dy="0">Клиент</tspan></text><text x="216" y="260" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">list / watch / get</text></g><g><rect x="488" y="144" width="304" height="144" rx="8" fill="#1F2937" stroke="#38E0FF" stroke-width="2"/><text x="640" y="196" text-anchor="middle" fill="#38E0FF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="640" dy="0">kube-apiserver</tspan></text><text x="640" y="260" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">watchcache готовится</text></g><g><rect x="488" y="400" width="304" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="640" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="640" dy="0">HTTP 429</tspan></text><text x="640" y="516" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">Retry-After + backoff</text></g><g><rect x="928" y="400" width="288" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="1072" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="1072" dy="0">etcd</tspan></text><text x="1072" y="516" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">GET / bounded list</text></g></svg>
