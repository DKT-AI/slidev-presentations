<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Прогрев watchcache без перегрузки</title><style>body{margin:0;background:#111827;color:#FFFFFF;font-family:Montserrat,Arial,sans-serif}main{max-width:1280px;margin:32px auto;padding:0 24px}h1{font-size:32px;font-weight:600}.diagram{overflow-x:auto}svg{display:block;width:100%;min-width:1280px}p{color:#9CA3AF;font-size:16px}</style></head><body><main><h1>Прогрев watchcache без перегрузки</h1><div class="diagram"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="watchcache-title watchcache-desc"><title id="watchcache-title">Прогрев watchcache без перегрузки</title><desc id="watchcache-desc">Во время прогрева watchcache API server отклоняет watch и часть list с HTTP 429, а допустимые запросы направляет в etcd.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38E0FF"/></marker></defs><rect width="1280" height="720" fill="#111827"/><path d="M 368 216 H 488" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 640 288 V 400" fill="none" stroke="#38E0FF" stroke-width="3"  marker-end="url(#arrow-accent)"/><path d="M 488 472 H 392 Q 384 472 384 464 V 256 Q 384 248 376 248 H 368" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 792 192 H 872 Q 880 192 880 200 V 464 Q 880 472 888 472 H 928" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="64" y="144" width="304" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="216" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="216" dy="0">Клиент</tspan></text><text x="216" y="260" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">list / watch / get</text></g><g><rect x="488" y="144" width="304" height="144" rx="8" fill="#1F2937" stroke="#38E0FF" stroke-width="2"/><text x="640" y="196" text-anchor="middle" fill="#38E0FF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="640" dy="0">kube-apiserver</tspan></text><text x="640" y="260" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">watchcache готовится</text></g><g><rect x="488" y="400" width="304" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="640" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="640" dy="0">HTTP 429</tspan></text><text x="640" y="516" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">Retry-After + backoff</text></g><g><rect x="928" y="400" width="288" height="144" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="1072" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="1072" dy="0">etcd</tspan></text><text x="1072" y="516" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">GET / bounded list</text></g><line x1="64" y1="620" x2="1216" y2="620" stroke="#374151"/><text x="64" y="664" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="24">Пунктир: ответ 429 клиенту. Клиент повторяет запрос после задержки.</text></svg></div><p>Концептуальная схема. Стиль DKT. Подготовлено с diagram-design 2.6.46.</p></main></body></html>
