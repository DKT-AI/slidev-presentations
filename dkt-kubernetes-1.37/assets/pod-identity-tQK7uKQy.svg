<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 180 1280 410" role="img" aria-labelledby="pod-identity-title pod-identity-desc" id="pod-identity-root"><title id="pod-identity-title">Сертификат доставлен. Приложение должно его обновить</title><desc id="pod-identity-desc">Signer выдаёт сертификат, kubelet обновляет проецируемые файлы, а приложение перечитывает сертификат и доверенные CA.</desc><defs>
      <style>1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pod-identity-root { color: #FFFFFF; font-family: Montserrat,Arial,sans-serif; }
      #pod-identity-root .diagram { overflow-x:auto }</style><marker id="pod-identity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><marker id="pod-identity-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38E0FF"/></marker></defs><rect width="1280" height="720" fill="#111827"/><path d="M 316 280 H 360" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#pod-identity-arrow)"/><path d="M 612 280 H 656" fill="none" stroke="#38E0FF" stroke-width="3"  marker-end="url(#pod-identity-arrow-accent)"/><path d="M 908 280 H 952" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#pod-identity-arrow)"/><path d="M 788 440 V 364" fill="none" stroke="#9CA3AF" stroke-width="3"  marker-end="url(#pod-identity-arrow)"/><g><rect x="64" y="204" width="252" height="160" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="190" y="256" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="190" dy="0">Signer</tspan></text><text x="190" y="336" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">выдаёт сертификат</text></g><g><rect x="360" y="204" width="252" height="160" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="486" y="256" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="486" dy="0">kubelet</tspan></text><text x="486" y="336" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">запрос и ротация</text></g><g><rect x="656" y="204" width="252" height="160" rx="8" fill="#1F2937" stroke="#38E0FF" stroke-width="2"/><text x="782" y="256" text-anchor="middle" fill="#38E0FF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="782" dy="0">Файлы Pod</tspan></text><text x="782" y="336" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">ключ · сертификат</text></g><g><rect x="952" y="204" width="264" height="160" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="1084" y="256" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="1084" dy="0">Приложение</tspan></text><text x="1084" y="336" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">перечитывает файлы</text></g><g><rect x="656" y="440" width="252" height="128" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="782" y="492" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600"><tspan x="782" dy="0">Trust bundles</tspan></text><text x="782" y="540" text-anchor="middle" fill="#9CA3AF" font-family="Montserrat, Arial, sans-serif" font-size="21">доверенные CA</text></g></svg>
