<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DKT Slidev Presentations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 640px; padding: 40px; }
    h1 { font-size: 2em; font-weight: 800; margin-bottom: 8px; color: #fff; }
    p.sub { color: #94A3B8; margin-bottom: 32px; }
    .card { background: #1E293B; border: 1px solid rgba(124,58,237,0.2); border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; text-decoration: none; display: block; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: #7C3AED; transform: translateY(-2px); }
    .card h2 { font-size: 1.1em; font-weight: 700; color: #E2E8F0; }
    .card span { font-size: 0.85em; color: #94A3B8; }
    .badge { display: inline-block; background: rgba(124,58,237,0.85); color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.75em; font-weight: 700; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DevOps Kitchen Talks</h1>
    <p class="sub">Slidev Presentations</p>
    <a class="card" href="./dkt-demo/">
      <h2>DKT Theme — Feature Showcase <span class="badge">Demo</span></h2>
      <span>Полная демо slidev-theme-dkt. Layouts, K8s icons, v-mark, Magic Move, View Transitions. 40+ слайдов.</span>
    </a>
    <a class="card" href="./dkt-k8s-rbac/">
      <h2>Kubernetes RBAC Deep Dive <span class="badge">DKT #95</span></h2>
      <span>Role, ClusterRole, RoleBinding, ServiceAccount. Практические примеры с kubectl.</span>
    </a>
  </div>
</body>
</html>
